name: Publish on CurseForge & Modrinth

on: [ workflow_dispatch ]

env:
  MINECRAFT_VERSION: 1.20.1
  JAVA_VERSION: 21
  VERSION: 1.20.1-1.0.2
  RELEASE_NAME_CURSEFORGE: "pizzadelight-forge-1.20.1-1.0.2"
  RELEASE_NAME_MODRINTH: "[1.20.1] Pizza Delight 1.0.2"
  MODRINTH_TOKEN: ${{ secrets.MODRINTH }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Publish (CurseForge/Modrinth)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1113260
          modrinth-id: 6VTyLLiG

          curseforge-token: "${{ env.CURSEFORGE_TOKEN }}"
          modrinth-token: "${{ env.MODRINTH_TOKEN }}"

          modrinth-name: ${{ env.RELEASE_NAME_MODRINTH }}
          curseforge-name: ${{ env.RELEASE_NAME_CURSEFORGE }}
          version: "${{ env.VERSION }}"
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: forge
          game-versions: "${{ env.MINECRAFT_VERSION }}"
          dependencies: |
            farmers-delight(required){modrinth:R2OftAxM}{curseforge:398521}

          java: "${{ env.JAVA_VERSION }}"